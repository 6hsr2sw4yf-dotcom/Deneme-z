<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Deneme Coz">
  <title>Deneme Coz - KPSS On Lisans Optik</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%230b1220'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='%23f59e0b'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(16, 24, 42, 0.82);
      --line: rgba(255,255,255,.10);
      --text: #eef3ff;
      --muted: #9aa8c7;
      --turuncu: #F59E0B;
      --mavi: #2563EB;
      --kirmizi: #DC2626;
      --yesil: #16A34A;
      --mor: #9333EA;
      --ok: #22c55e;
      --bad: #ef4444;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    button, input { font: inherit; }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }

    .splash, .home {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(245,158,11,.28), transparent 42%),
        radial-gradient(ellipse at 80% 90%, rgba(37,99,235,.18), transparent 40%),
        linear-gradient(180deg, #10182c 0%, #070b14 55%, #05070e 100%);
    }
    .bg-mark {
      position: absolute; inset: -40px auto auto 50%;
      transform: translateX(-50%);
      width: min(720px, 140vw); opacity: .16; filter: blur(6px);
      pointer-events: none;
    }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,.55) 100%);
    }

    .splash-inner, .home-inner { position: relative; z-index: 2; }
    .splash { display: none; align-items: center; justify-content: center; }
    .splash.active { display: flex; }
    .splash-inner { text-align: center; padding: 24px; }
    .logo-wrap { width: min(280px, 72vw); margin: 0 auto 18px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
    .logo-wrap svg { width: 100%; height: auto; }
    .brand { font-size: 28px; font-weight: 800; letter-spacing: .3px; }
    .brand span { color: var(--turuncu); }
    .sub { color: var(--muted); margin-top: 6px; }
    .loader { width: 168px; height: 6px; margin: 22px auto 0; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
    .loader > i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--mavi), var(--turuncu)); animation: load 1.4s ease infinite; }
    @keyframes load { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

    .home-inner { max-width: 920px; margin: 0 auto; padding: 28px 18px 40px; }
    .hero { text-align: center; margin-bottom: 22px; }
    .hero .logo-wrap { width: min(190px, 46vw); }
    .year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .year-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px 14px; text-align: left; color: var(--text); cursor: pointer;
      box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease;
    }
    .year-card:hover { transform: translateY(-2px); border-color: rgba(245,158,11,.45); }
    .year-card b { display: block; font-size: 28px; line-height: 1; }
    .year-card small { color: var(--muted); }
    .meta { margin-top: 10px; font-size: 12px; color: #c9d4ee; }
    .bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--mavi), var(--turuncu)); }

    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: rgba(7,11,20,.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn, .primary, .ghost, .danger {
      border: 0; border-radius: 12px; cursor: pointer; padding: 10px 14px; font-weight: 700;
    }
    .icon-btn { background: rgba(255,255,255,.08); color: var(--text); min-width: 42px; }
    .primary { background: linear-gradient(90deg, #2563eb, #f59e0b); color: #081018; }
    .ghost { background: rgba(255,255,255,.08); color: var(--text); }
    .danger { background: rgba(239,68,68,.16); color: #fecaca; }
    .grow { flex: 1; }
    .muted { color: var(--muted); }

    .wrap { max-width: 980px; margin: 0 auto; padding: 14px; }
    .tabs, .subs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tab, .subtab {
      border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text);
      border-radius: 999px; padding: 8px 12px; cursor: pointer; white-space: nowrap; font-weight: 700;
    }
    .tab.active { background: #1e3a8a; border-color: #60a5fa; }
    .subtab.active { color: #081018; }

    .section {
      margin: 14px 0 18px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
      background: rgba(12,18,32,.78);
    }
    .section h3 {
      margin: 0; padding: 10px 14px; font-size: 15px; display: flex; justify-content: space-between;
    }
    .q {
      display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: center;
      padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.06);
    }
    .q.ok { background: rgba(34,197,94,.10); }
    .q.bad { background: rgba(239,68,68,.10); }
    .q.blank { background: rgba(148,163,184,.08); }
    .num { font-weight: 800; color: #dbe7ff; }
    .choices { display: flex; gap: 8px; flex-wrap: wrap; }
    .choice {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.22);
      background: transparent; color: var(--text); font-weight: 800; cursor: pointer;
    }
    .choice.selected { background: #fff; color: #0b1220; border-color: #fff; }
    .choice.correct { background: var(--ok); border-color: var(--ok); color: #04130a; }
    .choice.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
    .foot {
      position: sticky; bottom: 0; display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(7,11,20,.94); border-top: 1px solid var(--line);
    }

    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat, .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    }
    .stat b { font-size: 28px; display: block; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
      align-items: center; justify-content: center; z-index: 50; padding: 18px;
    }
    .modal.active { display: flex; }
    .modal-card { width: min(420px, 100%); background: #121a2d; border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
    .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  </style>
</head>
<body>
  <div id="splash" class="screen splash active">
    <svg class="bg-mark" viewBox="0 0 400 400" aria-hidden="true"><use href="#logoMark"></use></svg>
    <div class="vignette"></div>
    <div class="splash-inner">
      <div class="logo-wrap"><svg viewBox="0 0 400 400"><use href="#logoMark"></use></svg></div>
      <div class="brand">Deneme <span>Coz</span></div>
      <div class="sub">KPSS On Lisans optik form</div>
      <div class="loader"><i></i></div>
    </div>
  </div>

  <div id="home" class="screen home">
    <svg class="bg-mark" viewBox="0 0 400 400" aria-hidden="true"><use href="#logoMark"></use></svg>
    <div class="vignette"></div>
    <div class="home-inner">
      <div class="hero">
        <div class="logo-wrap"><svg viewBox="0 0 400 400"><use href="#logoMark"></use></svg></div>
        <div class="brand">Deneme <span>Coz</span></div>
        <div class="sub">2012 - 2024 KPSS On Lisans cevap anahtari</div>
      </div>
      <div id="yearGrid" class="year-grid"></div>
      <p class="note" style="text-align:center;margin-top:18px;">Cevaplarin telefonunda kalir. Ana ekrana ekleyerek uygulama gibi kullanabilirsin.</p>
    </div>
  </div>

  <div id="exam" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="backHome">Geri</button>
      <div class="grow"><b id="examTitle">2024 KPSS</b><div class="muted" id="examProg">0 / 120</div></div>
      <button class="ghost" id="clearBtn">Temizle</button>
    </div>
    <div class="wrap">
      <div class="tabs" id="testTabs"></div>
      <div style="height:10px"></div>
      <div class="subs" id="subTabs"></div>
      <div id="sheet"></div>
    </div>
    <div class="foot">
      <button class="ghost grow" id="saveBtn">Kaydet ve cik</button>
      <button class="primary grow" id="finishBtn">Sinavi bitir</button>
    </div>
  </div>

  <div id="results" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="resHome">Geri</button>
      <div class="grow"><b id="resTitle">Sonuc</b><div class="muted">Tahmini KPSS P93</div></div>
    </div>
    <div class="wrap">
      <div class="stats" id="resStats"></div>
      <div class="panel" style="margin-top:12px" id="resTable"></div>
      <div class="row" style="justify-content:stretch">
        <button class="ghost grow" id="reviewBtn">Cevaplari incele</button>
        <button class="primary grow" id="retryBtn">Yeniden coz</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <b>Sinavi bitirmek istiyor musun?</b>
      <p class="muted" id="modalText"></p>
      <div class="row">
        <button class="ghost" id="modalNo">Vazgec</button>
        <button class="primary" id="modalYes">Bitir</button>
      </div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="logoMark" viewBox="0 0 400 400">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#ff8a1f"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff7a18"/>
        </linearGradient>
      </defs>
      <circle cx="200" cy="200" r="170" fill="#0c1730"/>
      <path d="M70 210c30-70 90-110 130-118 40 8 100 48 130 118-28 62-86 108-130 118-44-10-102-56-130-118z" fill="#14305f"/>
      <path d="M128 168l72-22 72 22v86c-24 28-48 42-72 48-24-6-48-20-72-48z" fill="#dce9ff"/>
      <path d="M200 148v132" stroke="#8aa4d6" stroke-width="6"/>
      <path d="M86 120l70 28 8-22-70-28z" fill="#f4b942"/>
      <circle cx="86" cy="120" r="12" fill="#1e293b"/>
      <path d="M268 92c38 0 62 28 62 62 0 42-38 48-48 78h-28c10-32 48-40 48-74 0-18-12-32-32-32s-30 14-30 32h-30c0-42 28-66 58-66z" fill="url(#g1)"/>
      <circle cx="298" cy="258" r="34" fill="url(#g2)"/>
      <path d="M284 258l10 10 20-22" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <text x="200" y="228" text-anchor="middle" font-size="54" font-weight="800" fill="#fff" font-family="Segoe UI, sans-serif">Deneme</text>
      <text x="168" y="286" text-anchor="middle" font-size="58" font-weight="800" fill="#ff9a1f" font-family="Segoe UI, sans-serif">Coz</text>
    </symbol>
  </svg>

  <script>
    const KEYS = {
      "2012": {
        gy: ["A","C","B","D","E","E","D","B","B","B","D","D","C","C","A","E","D","C","B","A","D","E","B","C","A","B","A","C","D","E","A","B","B","C","C","A","D","E","D","E","D","C","C","A","D","B","E","A","A","D","E","B","C","B","D","C","B","D","E","C"],
        gk: ["D","B","A","C","E","C","A","B","E","C","D","B","A","C","E","D","B","C","E","A","D","B","E","C","A","A","E","B","D","A","D","E","D","D","B","A","E","D","C","C","B","A","C","A","D","E","B","E","A","B","E","C","E","D","C","B","A","D","E","A"]
      },
      "2014": {
        gy: ["C","B","C","A","B","C","C","D","B","D","C","A","C","D","C","A","D","B","C","C","E","E","C","C","E","E","C","B","E","E","C","A","D","C","E","B","E","B","D","C","E","A","A","C","D","C","A","B","C","C","D","C","B","B","D","D","D","C","D","B"],
        gk: ["C","C","A","C","A","C","A","A","A","A","B","A","A","D","A","A","A","A","A","C","A","A","A","A","B","A","B","A","C","C","E","B","C","C","A","E","E","E","A","D","E","D","B","D","D","C","E","B","C","E","B","D","D","A","A","A","C","E","E","D"]
      },
      "2016": {
        gy: ["B","B","E","D","C","B","D","C","D","E","B","C","D","A","B","A","D","C","E","D","E","D","A","E","E","C","E","B","A","A","D","E","E","B","C","E","B","C","A","C","A","C","A","B","D","D","B","E","B","D","C","C","B","A","E","B","C","B","A","D"],
        gk: ["E","A","D","C","A","A","C","A","D","B","B","E","D","E","A","C","D","B","E","B","B","E","A","D","E","D","E","C","A","C","E","C","B","A","B","A","D","D","E","C","E","B","C","D","C","D","D","C","E","A","C","A","E","C","E","D","B","A","B","A"]
      },
      "2018": {
        gy: ["B","C","A","C","E","A","B","B","C","D","D","C","A","B","C","E","D","B","D","B","A","A","D","B","A","E","C","E","D","E","B","A","C","A","E","B","C","E","C","E","D","B","E","A","E","D","E","A","A","B","D","B","D","A","C","C","E","B","D","C"],
        gk: ["D","E","D","C","E","D","B","A","D","C","D","B","A","C","E","C","B","C","E","E","C","E","A","B","E","A","B","E","A","D","C","B","E","C","D","C","D","A","B","A","B","C","D","B","E","E","C","C","B","D","A","E","C","C","E","C","E","A","D","B"]
      },
      "2020": {
        gy: ["A","B","A","A","C","D","B","C","E","B","C","B","C","C","E","D","B","C","C","E","E","B","E","B","D","A","D","A","E","B","D","A","B","C","E","E","A","C","E","C","D","A","A","C","A","C","B","B","B","D","B","D","B","A","D","C","E","C","E","B"],
        gk: ["E","D","C","B","E","E","A","C","D","B","D","B","A","D","C","D","A","A","E","B","D","C","D","A","B","D","E","D","C","C","A","E","A","B","A","E","B","C","C","A","B","C","D","C","E","E","B","C","C","A","B","E","D","B","A","C","A","E","B","D"]
      },
      "2022": {
        gy: ["A","B","E","C","A","E","C","E","D","B","C","C","A","D","C","A","A","C","D","C","A","B","C","D","D","B","C","E","D","B","E","C","E","C","A","E","B","A","A","E","D","D","A","C","B","A","B","C","B","D","B","C","D","E","B","C","A","B","C","C"],
        gk: ["A","C","D","A","D","D","A","C","A","C","D","B","B","C","C","E","A","E","D","D","E","B","E","C","C","E","A","A","C","B","E","B","B","D","A","A","D","D","E","C","C","E","C","B","D","E","C","A","C","A","D","A","C","B","D","A","A","B","A","B"]
      },
      "2024": {
        gy: ["E","A","C","D","C","B","E","B","B","D","D","C","C","C","B","B","D","A","B","E","E","A","C","C","B","A","D","E","B","D","C","E","A","C","E","D","E","B","C","D","B","E","D","D","B","A","C","C","E","A","D","A","B","C","B","E","E","B","B","A"],
        gk: ["D","A","A","C","B","B","C","A","D","B","D","C","D","D","E","B","C","B","D","B","B","B","A","C","A","A","D","A","C","A","E","A","E","B","E","B","D","A","E","C","D","C","B","D","D","D","A","D","C","A","B","E","B","A","E","A","C","C","E","B"]
      }
    };

    const SUBJECTS = {
      gy: [
        { id: "turkce", name: "Turkce", from: 0, to: 29, color: "#F59E0B" },
        { id: "matematik", name: "Matematik", from: 30, to: 59, color: "#2563EB" }
      ],
      gk: [
        { id: "tarih", name: "Tarih", from: 0, to: 26, color: "#DC2626" },
        { id: "cografya", name: "Cografya", from: 27, to: 44, color: "#16A34A" },
        { id: "vatandaslik", name: "Vatandaslik", from: 45, to: 59, color: "#9333EA" }
      ]
    };

    const STORE = "deneme-coz-v1";
    const YEARS = Object.keys(KEYS);
    const state = {
      year: "2024",
      test: "gy",
      subject: "turkce",
      review: false,
      data: load()
    };

    function emptyYear() {
      return { gy: Array(60).fill(null), gk: Array(60).fill(null), finished: false };
    }
    function load() {
      try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) { return {}; }
    }
    function save() {
      localStorage.setItem(STORE, JSON.stringify(state.data));
    }
    function yearData(year) {
      if (!state.data[year]) state.data[year] = emptyYear();
      return state.data[year];
    }
    function show(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      window.scrollTo(0, 0);
    }
    function filled(arr) { return arr.filter(Boolean).length; }
    function netOf(d, w) { return +(d - w / 4).toFixed(2); }

    function grade(year) {
      const d = yearData(year);
      const rows = [];
      let D = 0, W = 0, B = 0;
      ["gy","gk"].forEach(test => {
        SUBJECTS[test].forEach(sub => {
          let d0 = 0, w0 = 0, b0 = 0;
          for (let i = sub.from; i <= sub.to; i++) {
            const ans = d[test][i];
            const key = KEYS[year][test][i];
            if (!ans) b0++;
            else if (ans === key) d0++;
            else w0++;
          }
          D += d0; W += w0; B += b0;
          rows.push({ ...sub, test, d: d0, w: w0, b: b0, net: netOf(d0, w0), total: sub.to - sub.from + 1 });
        });
      });
      const gyNet = netOf(
        rows.filter(r => r.test === "gy").reduce((a,b)=>a+b.d,0),
        rows.filter(r => r.test === "gy").reduce((a,b)=>a+b.w,0)
      );
      const gkNet = netOf(
        rows.filter(r => r.test === "gk").reduce((a,b)=>a+b.d,0),
        rows.filter(r => r.test === "gk").reduce((a,b)=>a+b.w,0)
      );
      const totalNet = +(gyNet + gkNet).toFixed(2);
      const p93 = Math.max(20, Math.min(100, +(40 + totalNet * 0.5).toFixed(2)));
      return { D, W, B, gyNet, gkNet, totalNet, p93, rows };
    }

    function renderHome() {
      document.getElementById("yearGrid").innerHTML = YEARS.map(y => {
        const d = yearData(y);
        const done = filled(d.gy) + filled(d.gk);
        const g = d.finished ? grade(y) : null;
        return `<button class="year-card" data-year="${y}">
          <b>${y}</b>
          <small>On Lisans GY + GK</small>
          <div class="meta">${g ? ("Net " + g.totalNet + " | Tahmini " + g.p93) : (done + " / 120 isaretlendi")}</div>
          <div class="bar"><i style="width:${(done/120)*100}%"></i></div>
        </button>`;
      }).join("");
    }

    function openYear(year) {
      state.year = year;
      state.review = false;
      state.test = "gy";
      state.subject = SUBJECTS.gy[0].id;
      document.getElementById("examTitle").textContent = year + " KPSS On Lisans";
      renderExam();
      show("exam");
    }

    function renderExam() {
      const d = yearData(state.year);
      const done = filled(d.gy) + filled(d.gk);
      document.getElementById("examProg").textContent = done + " / 120 soru";
      document.getElementById("testTabs").innerHTML = `
        <button class="tab ${state.test==="gy"?"active":""}" data-test="gy">Genel Yetenek ${filled(d.gy)}/60</button>
        <button class="tab ${state.test==="gk"?"active":""}" data-test="gk">Genel Kultur ${filled(d.gk)}/60</button>
      `;
      document.getElementById("subTabs").innerHTML = SUBJECTS[state.test].map(s => {
        const n = d[state.test].slice(s.from, s.to + 1).filter(Boolean).length;
        const active = state.subject === s.id;
        return `<button class="subtab ${active?"active":""}" data-sub="${s.id}" style="${active?`background:${s.color}`:""}">${s.name} ${n}/${s.to-s.from+1}</button>`;
      }).join("");

      const sheet = document.getElementById("sheet");
      sheet.innerHTML = SUBJECTS[state.test].map(s => {
        let html = `<section class="section" id="sec-${s.id}"><h3 style="background:${s.color}22;color:${s.color}"><span><span class="dot" style="background:${s.color}"></span>${s.name}</span><span>${d[state.test].slice(s.from,s.to+1).filter(Boolean).length}/${s.to-s.from+1}</span></h3>`;
        for (let i = s.from; i <= s.to; i++) {
          const ans = d[state.test][i];
          const key = KEYS[state.year][state.test][i];
          let cls = "q";
          if (state.review) cls += !ans ? " blank" : (ans === key ? " ok" : " bad");
          html += `<div class="${cls}"><div class="num">${i+1}</div><div class="choices">`;
          "ABCDE".split("").forEach(ch => {
            let c = "choice";
            if (state.review) {
              if (ch === key) c += " correct";
              else if (ch === ans && ans !== key) c += " wrong";
            } else if (ans === ch) c += " selected";
            html += `<button class="${c}" data-q="${i}" data-choice="${ch}" ${state.review?"disabled":""}>${ch}</button>`;
          });
          html += `</div></div>`;
        }
        html += `</section>`;
        return html;
      }).join("");
    }

    function renderResults() {
      const g = grade(state.year);
      document.getElementById("resTitle").textContent = state.year + " sonucu";
      document.getElementById("resStats").innerHTML = `
        <div class="stat"><span class="muted">Dogru</span><b>${g.D}</b></div>
        <div class="stat"><span class="muted">Yanlis</span><b>${g.W}</b></div>
        <div class="stat"><span class="muted">Bos</span><b>${g.B}</b></div>
        <div class="stat"><span class="muted">Toplam net</span><b>${g.totalNet}</b></div>
        <div class="stat"><span class="muted">GY net</span><b>${g.gyNet}</b></div>
        <div class="stat"><span class="muted">GK net</span><b>${g.gkNet}</b></div>
        <div class="stat" style="grid-column:1/-1"><span class="muted">Tahmini P93</span><b>${g.p93}</b>
          <div class="note">Bu puan tahmini olarak hesaplanmistir. Kesin puan OSYM degerlendirmesine gore degisebilir. Net = Dogru - (Yanlis / 4)</div>
        </div>`;
      document.getElementById("resTable").innerHTML = `<table>
        <tr><th>Ders</th><th>D</th><th>Y</th><th>B</th><th>Net</th></tr>
        ${g.rows.map(r => `<tr><td><span class="dot" style="background:${r.color}"></span>${r.name}</td><td>${r.d}</td><td>${r.w}</td><td>${r.b}</td><td>${r.net}</td></tr>`).join("")}
      </table>`;
    }

    document.getElementById("yearGrid").addEventListener("click", e => {
      const btn = e.target.closest("[data-year]");
      if (!btn) return;
      const year = btn.dataset.year;
      if (yearData(year).finished) {
        state.year = year;
        renderResults();
        show("results");
      } else openYear(year);
    });

    document.getElementById("testTabs").addEventListener("click", e => {
      const btn = e.target.closest("[data-test]");
      if (!btn) return;
      state.test = btn.dataset.test;
      state.subject = SUBJECTS[state.test][0].id;
      renderExam();
    });
    document.getElementById("subTabs").addEventListener("click", e => {
      const btn = e.target.closest("[data-sub]");
      if (!btn) return;
      state.subject = btn.dataset.sub;
      document.getElementById("sec-" + state.subject).scrollIntoView({ behavior: "smooth", block: "start" });
      renderExam();
    });
    document.getElementById("sheet").addEventListener("click", e => {
      const btn = e.target.closest("[data-choice]");
      if (!btn || state.review) return;
      const i = +btn.dataset.q;
      const ch = btn.dataset.choice;
      const d = yearData(state.year);
      d.gy = d.gy || Array(60).fill(null);
      d.gk = d.gk || Array(60).fill(null);
      d[state.test][i] = d[state.test][i] === ch ? null : ch;
      d.finished = false;
      save();
      renderExam();
    });

    document.getElementById("backHome").onclick = () => { save(); renderHome(); show("home"); };
    document.getElementById("saveBtn").onclick = () => { save(); renderHome(); show("home"); };
    document.getElementById("resHome").onclick = () => { renderHome(); show("home"); };
    document.getElementById("clearBtn").onclick = () => {
      if (!confirm("Bu yilin cevaplarini temizlemek istiyor musun?")) return;
      state.data[state.year] = emptyYear();
      save();
      renderExam();
    };
    document.getElementById("finishBtn").onclick = () => {
      const d = yearData(state.year);
      const bos = 120 - filled(d.gy) - filled(d.gk);
      document.getElementById("modalText").textContent = bos
        ? ("Cevaplanmayan " + bos + " soru var. Yine de bitirilsin mi?")
        : "Cevaplar kaydedilip netlerin hesaplanacak.";
      document.getElementById("modal").classList.add("active");
    };
    document.getElementById("modalNo").onclick = () => document.getElementById("modal").classList.remove("active");
    document.getElementById("modalYes").onclick = () => {
      yearData(state.year).finished = true;
      save();
      document.getElementById("modal").classList.remove("active");
      renderResults();
      show("results");
    };
    document.getElementById("reviewBtn").onclick = () => {
      state.review = true;
      renderExam();
      show("exam");
    };
    document.getElementById("retryBtn").onclick = () => {
      state.data[state.year] = emptyYear();
      save();
      openYear(state.year);
    };

    setTimeout(() => { renderHome(); show("home"); }, 1400);
  </script>
</body>
</html>
